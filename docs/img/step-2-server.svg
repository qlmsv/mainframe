<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Segoe UI, -apple-system, Arial, sans-serif">
  <rect width="640" height="380" fill="#f4f5f7"/>
  <text x="24" y="38" font-size="20" font-weight="700" fill="#111">Создание облачного сервера</text>
  <g font-size="13" fill="#555">
    <text x="24" y="72">1. Операционная система</text><rect x="230" y="58" width="150" height="22" rx="5" fill="#fff" stroke="#ccd"/><text x="240" y="74" fill="#111">Ubuntu 24.04</text>
    <text x="24" y="104">2. Регион</text><rect x="230" y="90" width="150" height="22" rx="5" fill="#fff" stroke="#ccd"/><text x="240" y="106" fill="#111">Казань</text>
    <text x="24" y="136">3. Конфигурация</text><rect x="230" y="122" width="250" height="22" rx="5" fill="#fff" stroke="#ccd"/><text x="240" y="138" fill="#111">Cloud KZN 50 · 4 ГБ · 1 000 ₽/мес</text>
    <text x="24" y="168">4–6. Сеть, защита, вход</text><text x="230" y="168" fill="#999">оставь как есть</text>
  </g>
  <text x="24" y="206" font-size="14" font-weight="700" fill="#111">7. Сценарий cloud-init</text>
  <rect x="24" y="216" width="592" height="88" rx="8" fill="#fff" stroke="#e2602b" stroke-width="2.5"/>
  <text x="38" y="242" font-size="12.5" fill="#111" font-family="Consolas, monospace">#!/bin/sh</text>
  <text x="38" y="264" font-size="12.5" fill="#111" font-family="Consolas, monospace">curl -fsSL https://raw.githubusercontent.com/qlmsv/mainframe/main/</text>
  <text x="38" y="284" font-size="12.5" fill="#111" font-family="Consolas, monospace">scripts/install-server.sh | bash -s</text>
  <rect x="314" y="271" width="190" height="19" rx="4" fill="#e2602b"/><text x="320" y="285" font-size="12.5" fill="#fff" font-family="Consolas, monospace">7412345678:AAH3k9pQ…</text>
  <text x="24" y="330" font-size="13" fill="#e2602b" font-weight="700">Вставь две строки из инструкции, вместо КЛЮЧ_БОТА твой ключ.</text>
  <rect x="460" y="342" width="156" height="30" rx="8" fill="#2a7de1"/><text x="538" y="362" font-size="14" fill="#fff" text-anchor="middle">Заказать</text>
</svg>
