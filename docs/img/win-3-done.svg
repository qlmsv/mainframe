<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Consolas, monospace">
  <rect width="640" height="260" fill="#e8e8e8"/>
  <rect x="20" y="20" width="600" height="220" rx="6" fill="#012456"/>
  <rect x="20" y="20" width="600" height="28" rx="6" fill="#f3f3f3"/>
  <text x="34" y="39" font-family="Segoe UI, Arial" font-size="13" fill="#222">Windows PowerShell</text>
  <text x="34" y="80" font-size="13" fill="#7fd6ff">&gt; Подключаюсь к серверу</text>
  <text x="34" y="102" font-size="13" fill="#7fd6ff">&gt; Службы моста (запускаются сами при входе в Windows)</text>
  <text x="34" y="130" font-size="14" fill="#8ef0a0" font-weight="700">&gt; Готово. Компьютер подключён к помощнику.</text>
  <text x="34" y="156" font-size="13" fill="#eee">Работает, пока компьютер включён.</text>
  <text x="34" y="200" font-family="Segoe UI, Arial" font-size="13" fill="#ffd27a">В пульте (Ещё → Система) у компьютера загорится «на связи».</text>
</svg>
