<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <title>Мейнфрейм</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-name">Мейнфрейм</div>
          <div class="brand-sub" id="brand-sub">личный пульт</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-status" id="side-status"></div>
    </aside>

    <header class="topbar">
      <div class="brand compact">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-name" id="top-title">Мейнфрейм</div>
      </div>
      <div class="top-actions">
        <span class="top-live" id="top-live"></span>
        <button class="top-stop" id="top-stop" aria-label="Остановить всё"></button>
      </div>
    </header>

    <main class="main">
      <div id="banner"></div>
      <div id="view"></div>
    </main>

    <nav class="tabbar" id="tabbar"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
