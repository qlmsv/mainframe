<!doctype html>
<!-- Vega for Telegram video stickers: the same star as public/spark.js, one state per page (?s=thinking).
     Every animation loops in 2 s, so scripts/spark-stickers.mjs can pause it at any time and take a frame. -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; background: transparent; }
svg { width: 512px; height: 512px; display: block; overflow: visible; }
svg * { transform-box: fill-box; transform-origin: center; }
.all, .spin, .rays { transform-box: view-box; transform-origin: 50px 50px; }
.fx { opacity: 0; }
.glow { animation: glow 2s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .6; transform: scale(1.08); } }
.spin { animation: breath 2s ease-in-out infinite; }
@keyframes breath { 50% { transform: scale(.95); } }
.rays { animation: rays 2s ease-in-out infinite; }
@keyframes rays { 50% { opacity: .35; transform: rotate(45deg) scale(.85); } 0%, 100% { transform: rotate(45deg); } }

/* thinking: the star turns slowly, the light flickers, three dots rise */
.thinking .fx-think { opacity: 1; }
.thinking .spin { animation: turn 2s ease-in-out infinite; }
@keyframes turn { 0% { transform: rotate(0) scale(.96); } 50% { transform: rotate(45deg) scale(.9); } 100% { transform: rotate(90deg) scale(.96); } }
.thinking .glow { animation: flicker 1s steps(1) infinite, glow 2s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { opacity: 1; } 30% { opacity: .7; } 45% { opacity: .95; } 70% { opacity: .75; } }
.fx-think circle { animation: dot 1s infinite ease-in-out; }
.fx-think circle:nth-child(2) { animation-delay: -.8s; } .fx-think circle:nth-child(3) { animation-delay: -.6s; }
@keyframes dot { 50% { transform: translateY(-4px); opacity: .35; } }

/* working: spins fast, pulses, sparks fly around */
.working .fx-work { opacity: 1; }
.working .spin { animation: whirl 1s linear infinite; }
@keyframes whirl { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(45deg) scale(1.08); } 100% { transform: rotate(90deg) scale(1); } }
.working .glow { animation: glow .5s ease-in-out infinite; }
.orbit { transform-box: view-box; transform-origin: 50px 50px; animation: orbit 2s linear infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }

/* done: bursts with light, sparkles around */
.done .fx-done { opacity: 1; }
.done .all { animation: pop 1s cubic-bezier(.3,.7,.3,1) infinite; }
@keyframes pop { 0%, 70%, 100% { transform: scale(1); } 20% { transform: scale(.82); } 42% { transform: scale(1.16); } }
.done .glow { animation: glow .5s ease-in-out infinite; }
.done .rays { animation: rays .5s ease-in-out infinite; }
.sp { animation: tw 1s ease-in-out infinite; }
.sp:nth-child(2) { animation-delay: -.66s; } .sp:nth-child(3) { animation-delay: -.33s; } .sp:nth-child(4) { animation-delay: -.5s; }
@keyframes tw { 0%, 100% { transform: scale(.4); opacity: .2; } 50% { transform: scale(1.15); opacity: 1; } }

/* error: the light dims and shivers, a little question mark */
.error .fx-error { opacity: 1; }
.error .all { animation: shiver 2s ease-in-out infinite; }
@keyframes shiver { 0%, 100% { transform: rotate(-8deg) scale(.86); } 25% { transform: rotate(6deg) scale(.84); } 50% { transform: rotate(-4deg) scale(.82); } 75% { transform: rotate(5deg) scale(.85); } }
.error .core { filter: saturate(.3) brightness(.85); }
.error .glow { filter: hue-rotate(-20deg) saturate(1.6); animation: glow 1s ease-in-out infinite; }
.fx-error { animation: wob 1s ease-in-out infinite; }
@keyframes wob { 50% { transform: rotate(12deg) translateY(-2px); } }

/* waiting: shines steadily, soft rings call you */
.waiting .fx-wait { opacity: 1; }
.waiting .spin { animation: twinkle 2s ease-in-out infinite; }
@keyframes twinkle { 0%, 40%, 100% { transform: scale(1); } 48% { transform: scale(1.1, .8); } 56% { transform: scale(1); } }
.ring { animation: ring 2s ease-out infinite; }
.ring:nth-child(2) { animation-delay: -1s; }
@keyframes ring { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.35); opacity: 0; } }
</style></head><body>
<svg id="s" viewBox="-6 -6 112 112" aria-hidden="true">
  <defs>
    <radialGradient id="g"><stop offset="0" stop-color="#e2602b" stop-opacity=".6"/><stop offset=".5" stop-color="#e2602b" stop-opacity=".18"/><stop offset="1" stop-color="#e2602b" stop-opacity="0"/></radialGradient>
    <radialGradient id="c"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fff1e6"/><stop offset="1" stop-color="#f08a55"/></radialGradient>
  </defs>
  <circle class="glow" cx="50" cy="50" r="46" fill="url(#g)"/>
  <g class="fx fx-wait"><circle class="ring" cx="50" cy="50" r="34" fill="none" stroke="#e2602b" stroke-width="2.5"/><circle class="ring" cx="50" cy="50" r="34" fill="none" stroke="#e2602b" stroke-width="2.5"/></g>
  <g class="all"><g class="spin">
    <path class="rays" d="M50 25 52.8 47.2 75 50 52.8 52.8 50 75 47.2 52.8 25 50 47.2 47.2z" fill="#f6a77c" opacity=".6"/>
    <path class="core" d="M50 10C52 38 55 45 90 50C55 55 52 62 50 90C48 62 45 55 10 50C45 45 48 38 50 10z" fill="url(#c)"/>
    <circle cx="50" cy="50" r="7" fill="#fff"/>
  </g></g>
  <g class="fx fx-think" fill="#f6a77c"><circle cx="72" cy="16" r="3.2"/><circle cx="81" cy="16" r="3.2"/><circle cx="90" cy="16" r="3.2"/></g>
  <g class="fx fx-work"><g class="orbit"><circle cx="50" cy="4" r="3.6" fill="#ffb020"/><circle cx="92" cy="62" r="3" fill="#1f9d55"/><circle cx="10" cy="72" r="2.6" fill="#e2602b"/></g></g>
  <g class="fx fx-done"><path class="sp" d="M12 14 l2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4z" fill="#ffb020"/><path class="sp" d="M88 10 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#1f9d55"/><path class="sp" d="M90 80 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z" fill="#e2602b"/><path class="sp" d="M12 82 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z" fill="#fff"/></g>
  <g class="fx fx-error"><text x="74" y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#d9302a">?</text></g>
</svg>
<script>
const s = new URLSearchParams(location.search).get('s') || 'waiting';
document.getElementById('s').classList.add(s);
// Frame at t milliseconds: every animation paused at the same moment.
window.frameAt = (t) => { for (const a of document.getAnimations()) { a.pause(); a.currentTime = t; } };
</script>
</body></html>
