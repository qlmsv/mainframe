<!doctype html>
<!-- Искра for Telegram video stickers: the same drop as public/spark.js, one state per page (?s=thinking).
     Every animation loops in 2 s, so scripts/spark-stickers.mjs can pause it at any time and take a frame. -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; background: transparent; }
svg { width: 512px; height: 512px; display: block; overflow: visible; }
svg * { transform-box: fill-box; transform-origin: center; }
.all, .body { transform-box: view-box; transform-origin: 50% 88%; }
.fx, .happy { opacity: 0; }
.blush { opacity: 0; }
.glow { animation: glow 2s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .55; transform: scale(1.06); } }
.body { animation: breath 2s ease-in-out infinite; }
@keyframes breath { 50% { transform: scale(1.03, .98); } }

/* thinking: eyes run left and right, the glow flickers, dots rise */
.thinking .fx-think { opacity: 1; }
.thinking .look { animation: look 2s ease-in-out infinite; }
@keyframes look { 0%, 100% { transform: translate(0, -2px); } 20%, 38% { transform: translate(-4px, -3px); } 58%, 80% { transform: translate(4px, -3px); } }
.thinking .glow { animation: flicker 1s steps(1) infinite, glow 2s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { opacity: 1; } 30% { opacity: .7; } 45% { opacity: .95; } 70% { opacity: .75; } }
.fx-think circle { animation: dot 1s infinite ease-in-out; }
.fx-think circle:nth-child(2) { animation-delay: -.8s; } .fx-think circle:nth-child(3) { animation-delay: -.6s; }
@keyframes dot { 50% { transform: translateY(-4px); opacity: .35; } }

/* working: pulses, sparks fly around */
.working .fx-work { opacity: 1; }
.working .body { animation: pulse .5s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07, 1.05); } }
.working .glow { animation: glow .5s ease-in-out infinite; }
.working .look { transform: translate(0, -1px); }
.orbit { transform-box: view-box; transform-origin: 50px 58px; animation: spin 2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.working .sp { animation: tw .5s ease-in-out infinite; }
.working .sp:nth-child(2) { animation-delay: -.25s; }

/* done: happy jump twice, eyes as arcs */
.done .fx-done, .done .happy { opacity: 1; }
.done .eyes { opacity: 0; }
.done .all { animation: jump 1s cubic-bezier(.3,.7,.3,1) infinite; }
@keyframes jump { 0%, 70%, 100% { transform: none; } 12% { transform: scale(1.08, .9); } 38% { transform: translateY(-12px) scale(.96, 1.05); } 60% { transform: scale(1.04, .96); } }
.done .glow { animation: glow .5s ease-in-out infinite; }
.sp { animation: tw 1s ease-in-out infinite; }
.sp:nth-child(2) { animation-delay: -.66s; } .sp:nth-child(3) { animation-delay: -.33s; }
@keyframes tw { 0%, 100% { transform: scale(.4); opacity: .2; } 50% { transform: scale(1.15); opacity: 1; } }

/* error: shrinks shyly, blushes red, a little question mark */
.error .fx-error, .error .blush { opacity: 1; }
.error .all { animation: shy 2s ease-in-out infinite; }
@keyframes shy { 0%, 100% { transform: rotate(-6deg) scale(.94, .9); } 50% { transform: rotate(-9deg) scale(.9, .86); } }
.error .look { transform: translate(-3px, 2px); }
.error .core { filter: hue-rotate(-18deg) saturate(1.5); }
.error .redden { opacity: 1; animation: red 2s ease-in-out infinite; }
@keyframes red { 50% { opacity: .55; } }
.error .blush { animation: red 1s ease-in-out infinite; }
.fx-error { animation: wob 1s ease-in-out infinite; }
@keyframes wob { 50% { transform: rotate(12deg) translateY(-2px); } }
.redden { opacity: 0; }

/* waiting: looks right at you, bigger eyes, blinks, soft rings */
.waiting .fx-wait { opacity: 1; }
.waiting .all { transform: translateY(-2px) scale(1.04); }
.waiting .eye { animation: blink 2s infinite; }
@keyframes blink { 0%, 44%, 52%, 100% { transform: scale(1.12, 1.12); } 48% { transform: scale(1.12, .1); } }
.waiting .pupil { opacity: 1; }
.pupil { opacity: 0; }
.ring { animation: ring 2s ease-out infinite; }
.ring:nth-child(2) { animation-delay: -1s; }
@keyframes ring { 0% { transform: scale(.7); opacity: .7; } 100% { transform: scale(1.4); opacity: 0; } }
</style></head><body>
<svg id="s" viewBox="-6 -2 112 112" aria-hidden="true">
  <defs>
    <radialGradient id="a" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff6ee"/><stop offset=".45" stop-color="#fbe6da"/><stop offset="1" stop-color="#e2602b"/></radialGradient>
    <radialGradient id="r" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#ff5a4e" stop-opacity=".55"/><stop offset="1" stop-color="#d9302a" stop-opacity=".9"/></radialGradient>
    <radialGradient id="b"><stop offset=".55" stop-color="#e2602b" stop-opacity=".35"/><stop offset="1" stop-color="#e2602b" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="50" cy="93" rx="16" ry="3" fill="#e2602b" opacity=".15"/>
  <circle class="glow" cx="50" cy="56" r="44" fill="url(#b)"/>
  <g class="fx fx-wait"><circle class="ring" cx="50" cy="58" r="30" fill="none" stroke="#e2602b" stroke-width="2.5"/><circle class="ring" cx="50" cy="58" r="30" fill="none" stroke="#e2602b" stroke-width="2.5"/></g>
  <g class="all"><g class="body">
    <path class="core" d="M50 20 q22 22 22 38 a22 22 0 0 1 -44 0 q0 -16 22 -38z" fill="url(#a)"/>
    <path class="redden" d="M50 20 q22 22 22 38 a22 22 0 0 1 -44 0 q0 -16 22 -38z" fill="url(#r)"/>
    <path d="M38 50 q2 -8 8 -12" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/>
    <g class="blush" fill="#ff3b3b" opacity=".6"><ellipse cx="37" cy="67" rx="4" ry="2.2"/><ellipse cx="63" cy="67" rx="4" ry="2.2"/></g>
    <g class="look">
      <g class="eyes"><ellipse class="eye" cx="43" cy="60" rx="3.8" ry="5.2" fill="#141414"/><ellipse class="eye" cx="57" cy="60" rx="3.8" ry="5.2" fill="#141414"/></g>
      <g class="pupil" fill="#fff"><circle cx="44.2" cy="58" r="1.3"/><circle cx="58.2" cy="58" r="1.3"/></g>
      <g class="happy" stroke="#141414" stroke-width="3.2" stroke-linecap="round" fill="none"><path d="M38.5 62 q4.5 -6 9 0"/><path d="M52.5 62 q4.5 -6 9 0"/></g>
    </g>
    <path d="M47 69 q3 2.5 6 0" stroke="#141414" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g></g>
  <g class="fx fx-think" fill="#141414"><circle cx="70" cy="22" r="3"/><circle cx="78" cy="22" r="3"/><circle cx="86" cy="22" r="3"/></g>
  <g class="fx fx-work"><g class="orbit"><circle cx="50" cy="18" r="3.6" fill="#e2602b"/><circle cx="84" cy="66" r="3" fill="#1f9d55"/><circle cx="16" cy="70" r="2.6" fill="#ffb020"/></g>
    <g><path class="sp" d="M16 28 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z" fill="#ffb020"/><path class="sp" d="M86 30 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z" fill="#e2602b"/></g></g>
  <g class="fx fx-done"><path class="sp" d="M12 24 l2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4z" fill="#e2602b"/><path class="sp" d="M86 16 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#1f9d55"/><path class="sp" d="M90 54 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z" fill="#ffb020"/></g>
  <g class="fx fx-error"><text x="72" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#d9302a">?</text></g>
</svg>
<script>
const s = new URLSearchParams(location.search).get('s') || 'waiting';
document.getElementById('s').classList.add(s);
// Frame at t milliseconds: every animation paused at the same moment.
window.frameAt = (t) => { for (const a of document.getAnimations()) { a.pause(); a.currentTime = t; } };
</script>
</body></html>
